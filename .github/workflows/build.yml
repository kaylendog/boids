name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # macOS Intel
          - os: macos-15
            target: x86_64-apple-darwin

          # macOS Apple Silicon
          - os: macos-15
            target: aarch64-apple-darwin

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ---------- Prepare binary ----------
      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/boids boids-${{ github.ref_name }}-${{ matrix.target }}
          chmod +x boids-${{ github.ref_name }}-${{ matrix.target }}

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          move target\${{ matrix.target }}\release\boids.exe boids-${{ github.ref_name }}-${{ matrix.target }}.exe

      # ---------- Release ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ github.ref_name }}
          name: boids ${{ github.ref_name }}
          files: |
            boids-${{ github.ref_name }}-${{ matrix.target }}*
