name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libx11-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boids-linux
          path: target/x86_64-unknown-linux-gnu/release/boids

  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-intel-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boids-macos-intel
          path: target/x86_64-apple-darwin/release/boids

  build-macos-arm:
    name: Build macOS Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boids-macos-arm
          path: target/aarch64-apple-darwin/release/boids

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            C:\Users\runner\.cargo\registry
            C:\Users\runner\.cargo\git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boids-windows
          path: target\x86_64-pc-windows-msvc\release\boids.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-macos-intel
      - build-macos-arm
      - build-windows
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: boids-linux
          path: ./binaries

      - name: Download macOS Intel binary
        uses: actions/download-artifact@v4
        with:
          name: boids-macos-intel
          path: ./binaries

      - name: Download macOS ARM binary
        uses: actions/download-artifact@v4
        with:
          name: boids-macos-arm
          path: ./binaries

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: boids-windows
          path: ./binaries

      - name: Rename and set executable
        run: |
          # Linux
          mv ./binaries/boids ./binaries/boids-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          chmod +x ./binaries/boids-${{ github.ref_name }}-x86_64-unknown-linux-gnu

          # macOS Intel
          mv ./binaries/boids ./binaries/boids-${{ github.ref_name }}-x86_64-apple-darwin
          chmod +x ./binaries/boids-${{ github.ref_name }}-x86_64-apple-darwin

          # macOS ARM
          mv ./binaries/boids ./binaries/boids-${{ github.ref_name }}-aarch64-apple-darwin
          chmod +x ./binaries/boids-${{ github.ref_name }}-aarch64-apple-darwin

          # Windows
          mv ./binaries/boids.exe ./binaries/boids-${{ github.ref_name }}-x86_64-pc-windows-msvc.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: boids ${{ github.ref_name }}
          files: ./binaries/*
