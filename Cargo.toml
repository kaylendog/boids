[package]
name = "boids"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17.3", features = ["file_watcher", "trace"] }
bevy_egui = "0.38.1"
bevy_panorbit_camera = "0.33.1"
bevy_spatial = "0.11.0"
clap = { version = "4.5.53", features = ["derive"] }
egui = "0.33.3"
itertools = "0.14.0"
oktree = { version = "0.5.0", features = ["bevy"] }
rand = "0.9.2"
rand_distr = "0.5.1"
strum = { version = "0.27.2", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[patch.crates-io]
bevy_spatial = { git = "https://github.com/adsick/bevy-spatial", branch = "bevy0_17" }
